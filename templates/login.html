{% extends "base.html" %}

{% block title %}Login - Sistema de Assinaturas{% endblock %}

{% block extra_css %}
<style>
    body { background: linear-gradient(135deg, #0d6efd 0%, #0a3d91 100%) fixed; }
    .login-card { border-radius: 16px; box-shadow: 0 20px 45px rgba(0,0,0,.25); }
    .login-logo {
        width: 72px; height: 72px; border-radius: 20px;
        background: #e7f0ff; color: #0d6efd; font-size: 2rem;
        display: inline-flex; align-items: center; justify-content: center;
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        <div class="card login-card">
            <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                    <div class="login-logo"><i class="bi bi-pen-fill"></i></div>
                    <h3 class="mt-3 fs-4">Sistema de Assinaturas</h3>
                    <p class="text-muted small mb-0">Contajur</p>
                </div>

                {% if erro %}
                <div class="alert alert-danger">{{ erro }}</div>
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuário</label>
                        <input type="text" class="form-control form-control-lg" id="username" name="username" autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Entrar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
